/* Search remains visible after the Services heading scrolls away. */
.intro{padding-bottom:0}
.search-sticky{position:sticky;top:0;z-index:3;padding:18px 18px 23px;background:#192f67;flex-shrink:0}
.search-sticky .search{margin-top:0;background:#ffffff15}
.scroll{scroll-padding-top:90px}

/* Only the catalog search pins; the company header scrolls with the page. */
.search-sticky{top:0;padding:8px 18px 12px;background:#172c61}
.scroll{scroll-padding-top:72px}

/* One continuous gradient travels with the header content. */
.phone{background:#080c16}
.status{background:#080c16}
.scroll{background-image:linear-gradient(180deg,#080c16 0px,#101c3d 95px,#1d356c 230px,#4163ac 350px,#e4e9f6 490px,#fff 590px);background-repeat:no-repeat;background-color:#fff;background-attachment:local;scroll-padding-top:0}
.appbar,.intro{background:transparent}
.search-sticky{position:relative;top:auto;z-index:auto;background:transparent;padding:8px 18px 20px}
.search-sticky .search{background:rgba(255,255,255,.12);border-color:rgba(218,229,255,.22)}

/* Search pins at the top edge of the scrolling viewport, below the status bar. */
.search-sticky{position:sticky;top:0;z-index:3;padding:3px 18px 20px;background:linear-gradient(180deg,#192d5b 0%,#1d356c 100%)}
.search-sticky .search{margin-top:0;background:rgba(255,255,255,.15)}
.scroll{scroll-padding-top:72px}

/* Colors sampled from the supplied mobile design reference. */
.phone,.status{background:#0b1d4b}
.scroll{background-image:linear-gradient(180deg,#0b1d4b 0px,#0c1f4f 60px,#192f6e 165px,#3754a1 245px,#708ad4 325px,#e4e9f6 490px,#fff 590px)}

/* Search uses the exact same gradient coordinates as the scrolling surface. */
.scroll{--surface-gradient:linear-gradient(180deg,#0b1d4b 0px,#0c1f4f 60px,#192f6e 165px,#3754a1 245px,#708ad4 325px,#e4e9f6 490px,#fff 590px)}
.search-sticky{background-image:var(--surface-gradient);background-color:#fff;background-repeat:no-repeat;background-size:100% 590px;background-position:0 var(--gradient-offset,-165px)}

/* High contrast search field once it reaches its pinned position. */
.search-sticky .search{transition:background-color .18s ease,color .18s ease,border-color .18s ease}
.search-sticky.is-pinned .search{background:#fff;border-color:#dce3ef;color:#34435d;backdrop-filter:none}
.search-sticky.is-pinned .search input{color:#17233a;caret-color:#17233a}
.search-sticky.is-pinned .search input::placeholder{color:#4a5870;opacity:1}
@media(prefers-reduced-motion:reduce){.search-sticky .search{transition:none}}

/* Inverse lower corners join the pinned white search surface to the list. */
.search-sticky.on-white{background:#fff}
.search-sticky.on-white::before,.search-sticky.on-white::after{content:"";position:absolute;bottom:-18px;width:18px;height:18px;pointer-events:none}
.search-sticky.on-white::before{left:0;background:radial-gradient(circle at 100% 100%,transparent 17.5px,#fff 18px)}
.search-sticky.on-white::after{right:0;background:radial-gradient(circle at 0 100%,transparent 17.5px,#fff 18px)}

/* Equal spacing around the search field. */
.search-sticky{padding:10px 18px}

/* Round the lower edge of the whole pinned search strip. */
.search-sticky{border-radius:0 0 22px 22px}
.search-sticky.on-white::before,.search-sticky.on-white::after{display:none}

/* Visible outline on both dark and light search states. */
.search-sticky .search{border:1.5px solid #879dc8}
.search-sticky.is-pinned .search{border:1.5px solid #9aaecf}
.search-sticky .search:focus-within{border-color:#4b80e3;box-shadow:0 0 0 2px rgba(75,128,227,.13)}

const clean=s=>s.replace(/\s*\(нет на [^)]+\)/gi,'');
const available=i=>catalog.products.filter(p=>catalog.proposed_groups[i].product_ids.includes(p.id)&&p[platform+'_prod']==='+'&&!p.exclude_proposed);
const plural=n=>n%10===1&&n%100!==11?'продукт':n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?'продукта':'продуктов';
function render(){document.querySelector('#grid').classList.toggle('connected-grid',productView==='connected');document.querySelector('.section-head strong').textContent=productView==='connected'?'Подключённые продукты':'Что вы хотите сделать?';if(productView==='connected'){const q=document.querySelector('#search').value.toLowerCase().trim();const shown=connectedProducts.filter(p=>p.name.toLowerCase().includes(q));document.querySelector('#grid').innerHTML=shown.map(p=>`<article class="connected-card"><img src="${imageURLs[`assets/connected-${p.image}.webp`]}" alt=""><div><strong>${esc(p.name)}</strong><small>Подключён</small></div><span class="connected-check" aria-label="Подключён">✓</span></article>`).join('')||'<p class="empty">Ничего не найдено. Попробуйте другой запрос.</p>';document.querySelector('#count').textContent=shown.length+' '+plural(shown.length);return}const q=document.querySelector('#search').value.toLowerCase().trim();let s=`<button class="card new" data-group="new"><strong>Новые продукты</strong><small>Скоро здесь</small><img class="situation-art" src="https://raw.githubusercontent.com/yourred/test/main/assets/icons/new-categories/01-similar-companies-v3-cartoon.png" alt=""></button>`;catalog.proposed_groups.forEach((g,i)=>{const ps=available(i);if(!ps.length||q&&![g.name,...ps.map(p=>p.name)].some(n=>n.toLowerCase().includes(q)))return;s+=`<button class="card" data-group="${i}" style="--bg:${colors[i][0]};--fg:${colors[i][1]}"><strong>${esc(g.name)}</strong><small>${ps.length} ${plural(ps.length)}</small><img class="situation-art" src="${imageURLs[`assets/situation-${i}.png`]}" alt=""></button>`});document.querySelector('#grid').innerHTML=s||'<p class="empty">Ничего не найдено. Попробуйте другой запрос.</p>';const n=catalog.products.filter(p=>p[platform+'_prod']==='+'&&!p.exclude_proposed).length;document.querySelector('#count').textContent=n+' '+plural(n);if(active!==null)openGroup(active,false)}
function openGroup(id,focus=true){active=id;const d=document.querySelector('#detail');const ps=id==='new'?[]:available(Number(id));d.innerHTML='<button class="back" id="back">← Все ситуации</button>'+(id==='new'?`<div class="placeholder"><img class="situation-art" src="https://raw.githubusercontent.com/yourred/test/main/assets/icons/new-categories/01-similar-companies-v3-cartoon.png" alt=""><h3>Новые продукты</h3><p>Здесь появятся новые возможности<br>для вашего бизнеса.</p></div>`:`<img class="detail-art" src="${imageURLs[`assets/situation-${id}.png`]}" alt=""><h2>${esc(catalog.proposed_groups[id].name)}</h2><p class="sub">${ps.length} ${plural(ps.length)} для вашего бизнеса</p>${ps.map(p=>`<div class="product"><img src="${imageURLs[`assets/${productArtIds.includes(p.id)?`product-${p.id}.webp`:`situation-${id}.png`}`]}" alt=""><span>${esc(clean(p.name))}</span></div>`).join('')}`);d.hidden=false;document.querySelector('#scroll').inert=true;document.querySelector('#back').onclick=closeGroup;if(focus){d.scrollTop=0;document.querySelector('#back').focus()}}
function closeGroup(){const id=active;document.querySelector('#detail').hidden=true;document.querySelector('#scroll').inert=false;active=null;document.querySelector(`[data-group="${id}"]`)?.focus()}
function selectPlatform(v){platform=v;document.querySelector('.device').classList.toggle('android',v==='android');document.querySelector('.phone').setAttribute('aria-label',v==='android'?'Предпросмотр Android':'Предпросмотр iPhone');document.querySelector('.switch').classList.toggle('android',v==='android');document.querySelectorAll('[data-platform]').forEach(b=>{const selected=b.dataset.platform===v;b.setAttribute('aria-checked',selected);b.tabIndex=selected?0:-1});render()}
function selectView(view){if(active!==null)closeGroup();productView=view;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));render()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>selectView(b.dataset.view));
document.querySelectorAll('[data-platform]').forEach(b=>b.onclick=()=>selectPlatform(b.dataset.platform));document.querySelector('.switch').onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();selectPlatform(e.key==='Home'?'ios':e.key==='End'?'android':platform==='ios'?'android':'ios');document.querySelector(`[data-platform="${platform}"]`).focus()}};document.querySelector('#grid').onclick=e=>{const b=e.target.closest('[data-group]');if(b)openGroup(b.dataset.group)};document.querySelector('#search').oninput=render;document.onkeydown=e=>{if(e.key==='Escape'&&active!==null)closeGroup()};const navPaths=['<path d="m3 11 9-8 9 8M6 10v11h4v-7h4v7h4V10"/>','<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>','<circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/>','<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>','<path d="M21 11a9 9 0 0 1-9 9H4l-2 2v-9a9 9 0 1 1 19-2Z"/><path d="M7 11h.01M12 11h.01M17 11h.01"/>'];document.querySelector('.bottom').innerHTML=['Главный','История','Платежи','Сервисы','Чат'].map((name,i)=>`<span class="navitem ${i===3?'active':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${navPaths[i]}</svg>${name}</span>`).join('');render();


const surfaceScroll=document.querySelector('#scroll');
const surfaceTabs=document.querySelector('.catalog-tabs-shell');
const surfaceSearch=document.querySelector('.search-sticky');
function syncHeaderGradient(){
 const top=surfaceScroll.getBoundingClientRect().top;
 const tabsHeight=surfaceTabs.getBoundingClientRect().height;
 surfaceScroll.style.setProperty('--tabs-height',`${tabsHeight}px`);
 for(const el of [surfaceTabs,surfaceSearch]){
  const y=el.getBoundingClientRect().top-top+surfaceScroll.scrollTop;
  el.style.setProperty('--surface-offset',`${-y}px`);
 }
 surfaceSearch.classList.toggle('is-pinned',surfaceScroll.scrollTop>1);
 surfaceTabs.classList.toggle('is-pinned',surfaceScroll.scrollTop>1);
}
surfaceScroll.addEventListener('scroll',syncHeaderGradient,{passive:true});
window.addEventListener('resize',syncHeaderGradient);
if(typeof ResizeObserver!=='undefined')new ResizeObserver(syncHeaderGradient).observe(surfaceScroll);
syncHeaderGradient();

function selectTheme(theme){
 const dark=theme==='dark';
 document.querySelector('.device').classList.toggle('dark',dark);
 document.querySelector('.theme-switch').classList.toggle('dark',dark);
 document.querySelector('.phone').style.colorScheme=dark?'dark':'light';
 document.querySelectorAll('[data-theme]').forEach(button=>{const selected=button.dataset.theme===theme;button.setAttribute('aria-checked',selected);button.tabIndex=selected?0:-1});
}
document.querySelectorAll('[data-theme]').forEach(button=>button.onclick=()=>selectTheme(button.dataset.theme));
document.querySelector('.theme-switch').onkeydown=event=>{
 if(['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){
  event.preventDefault();
  const theme=event.key==='Home'?'light':event.key==='End'?'dark':document.querySelector('.device').classList.contains('dark')?'light':'dark';
  selectTheme(theme);document.querySelector(`[data-theme="${theme}"]`).focus();
 }
};
</script></html>
